##write a code to build and publish docker image to ghcr.io
name: Publish Docker Image to GHCR      
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-image-name:latest
          file: ./Dockerfile        
          build-args: |
            VERSION=1.0.0 
            AUTHOR=${{ github.actor }}
            REPO=${{ github.repository }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
      - name: Get the current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT     

      - name: Image details
        run: |
          echo "Image pushed to ghcr.io/${{ github.repository_owner }}/my-image-name:latest"
          echo "Commit SHA: ${{ github.sha }}"  
          echo "Build Date: ${{ steps.date.outputs.date }}"
          echo "Author: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Version: 1.0.0"
          echo "Dockerfile: ./Dockerfile"
          echo "Context: ."
          echo "Tags: ghcr.io/${{ github.repository_owner }}/my-image-name:latest"
          echo "Build Args: VERSION=1.0.0, AUTHOR=${{ github.actor }}, REPO=${{ github.repository }}, COMMIT_SHA=${{ github.sha }}, BUILD_DATE=${{ steps.date.outputs.date }}"

          
